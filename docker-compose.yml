# =============================================================================
# telegram-ai-org docker-compose.yml — 멀티 컨테이너: bot + 3엔진 런타임
#
# 사용법:
#   # 1) 환경 변수 준비
#   cp .env.example .env && nano .env   # 필수 토큰/API키 입력
#
#   # 2) 전체 실행 (권장 — claude + gemini 동시)
#   docker compose --profile claude --profile gemini up -d
#
#   # 3) claude 계열만 실행 (PM/기획실/디자인실/개발실)
#   docker compose --profile claude up -d
#
#   # 4) gemini 계열만 실행 (성장실/리서치실/운영실)
#   docker compose --profile gemini up -d
#
#   # 5) 로그 확인
#   docker compose logs -f aiorg-pm
#
#   # 6) 전체 종료
#   docker compose down
#
# 서비스 구성:
#   [claude 런타임]   claude-runtime         — Claude Code CLI 상태 보증 서비스
#   [gemini 런타임]   gemini-runtime         — Gemini CLI 상태 보증 서비스
#   [claude]          aiorg-pm               — PM 글로벌 봇 (claude-code, sonnet-4-6)
#   [claude]          aiorg-product-bot      — 기획실 봇 (claude-code)
#   [claude]          aiorg-design-bot       — 디자인실 봇 (claude-code)
#   [claude]          aiorg-engineering-bot  — 개발실 봇 (claude-code)
#   [gemini]          aiorg-ops-bot          — 운영실 봇 (gemini-cli)
#   [gemini]          aiorg-growth-bot       — 성장실 봇 (gemini-cli)
#   [gemini]          aiorg-research-bot     — 리서치실 봇 (gemini-cli)
#
# 엔진 배정 원칙 (CLAUDE.md 기준):
#   PM / 개발실 / 디자인실 / 기획실  →  claude-code (복잡한 추론·코딩)
#   성장실 / 리서치실 / 운영실       →  gemini-cli  (실시간 웹검색·대용량 컨텍스트)
#
# 환경변수 주입 원칙:
#   - 공통 시크릿/토큰/API 키: .env (env_file) 에서 주입
#   - 엔진별 런타임 변수(ENGINE_TYPE, *_CLI_PATH 등): 각 서비스 environment 블록에서 주입
# =============================================================================

# ─────────────────────────────────────────────────────────────────────────────
# 공통 앵커: 모든 봇 서비스에 공유되는 설정
# ─────────────────────────────────────────────────────────────────────────────
x-bot-common: &bot-common
  env_file:
    - .env
  environment:
    AI_ORG_DATA_DIR: /app/data
  volumes:
    - ${HOME}/.gemini:/gemini-oauth:ro
    - ${HOME}/.claude:/claude-config:ro
    - ./logs:/app/logs
    - ./data:/app/data
    - ./reports:/app/reports
    - ./tasks:/app/tasks
    - ./skills:/app/skills:ro
    - ./config:/app/config:ro
    - ./memory:/app/memory
  restart: unless-stopped
  healthcheck:
    test:
      [
        "CMD",
        "python",
        "-c",
        "import os,sys; sys.exit(0 if os.path.exists(f'/tmp/telegram-ai-org-{os.environ.get(\"PM_ORG_NAME\",\"global\")}.pid') else 1)",
      ]
    interval: 60s
    timeout: 10s
    start_period: 30s
    retries: 3
  networks:
    - aiorg-network
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

# ─────────────────────────────────────────────────────────────────────────────
# 엔진 런타임 공통 앵커: 런타임 컨테이너 공유 설정
# ─────────────────────────────────────────────────────────────────────────────
x-engine-runtime-common: &engine-runtime-common
  restart: unless-stopped
  networks:
    - aiorg-network
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "3"

# ─────────────────────────────────────────────────────────────────────────────
# claude-code 봇 공통 환경변수 앵커
# ─────────────────────────────────────────────────────────────────────────────
x-claude-bot-env: &claude-bot-env
  AI_ENGINE: claude-code
  ENGINE_TYPE: claude-code
  CLAUDE_CLI_PATH: /opt/cli/bin/claude
  CLAUDE_DEFAULT_TIMEOUT_SEC: "14400"
  CLAUDE_RUNNER_MODE: cli
  CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS: "1"

# ─────────────────────────────────────────────────────────────────────────────
# gemini-cli 봇 공통 환경변수 앵커
# ─────────────────────────────────────────────────────────────────────────────
x-gemini-bot-env: &gemini-bot-env
  AI_ENGINE: gemini-cli
  ENGINE_TYPE: gemini-cli
  GEMINI_CLI_PATH: /opt/cli/bin/gemini
  GEMINI_CLI_DEFAULT_TIMEOUT_SEC: "1800"

services:
  # ===========================================================================
  # [엔진 런타임] claude-runtime — Claude Code CLI 상태 보증 서비스
  #   - telegram-ai-org:claude 이미지 빌드의 정규 소유자
  #   - claude CLI 바이너리(/opt/cli/bin/claude) 정상 실행 여부를 healthcheck
  #   - claude 계열 봇(aiorg-pm, aiorg-product-bot 등)이 이 서비스 healthy 후 시작
  # ===========================================================================
  claude-runtime:
    <<: *engine-runtime-common
    profiles: [claude]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENGINE: claude
    image: telegram-ai-org:claude
    container_name: aiorg-claude-runtime
    entrypoint: []
    # CLI 바이너리 존재 확인 후 무한 대기 (sidecar 역할)
    command: ["sh", "-c", "test -x /opt/cli/bin/claude && echo 'claude-runtime: CLI OK' && sleep infinity"]
    healthcheck:
      test: ["CMD", "sh", "-c", "test -x /opt/cli/bin/claude"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      PM_ORG_NAME: claude-runtime

  # ===========================================================================
  # [엔진 런타임] gemini-runtime — Gemini CLI 상태 보증 서비스
  #   - telegram-ai-org:gemini 이미지 빌드의 정규 소유자
  #   - gemini CLI 바이너리(/opt/cli/bin/gemini) 정상 실행 여부를 healthcheck
  #   - gemini 계열 봇(aiorg-growth-bot, aiorg-research-bot 등)이 이 서비스 healthy 후 시작
  # ===========================================================================
  gemini-runtime:
    <<: *engine-runtime-common
    profiles: [gemini]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENGINE: gemini
    image: telegram-ai-org:gemini
    container_name: aiorg-gemini-runtime
    entrypoint: []
    command: ["sh", "-c", "test -x /opt/cli/bin/gemini && echo 'gemini-runtime: CLI OK' && sleep infinity"]
    healthcheck:
      test: ["CMD", "sh", "-c", "test -x /opt/cli/bin/gemini"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      PM_ORG_NAME: gemini-runtime
      GEMINI_CLI_PATH: /opt/cli/bin/gemini
      GEMINI_CLI_MODEL: ${GEMINI_CLI_MODEL:-gemini-2.5-pro}

  # ===========================================================================
  # [claude 계열 봇] PM 글로벌 봇 — 전체 조직 오케스트레이션
  #   모델: claude-sonnet-4-6 (ANTHROPIC_MODEL 으로 지정)
  # ===========================================================================
  aiorg-pm:
    <<: *bot-common
    profiles: [claude]
    image: telegram-ai-org:claude
    container_name: aiorg-pm
    command: ["--org", "aiorg_pm_bot"]
    depends_on:
      claude-runtime:
        condition: service_healthy
    environment:
      <<: *claude-bot-env
      PM_ORG_NAME: aiorg_pm_bot
      ANTHROPIC_MODEL: claude-sonnet-4-6

  # ===========================================================================
  # [claude 계열 봇] 기획실 봇
  # ===========================================================================
  aiorg-product-bot:
    <<: *bot-common
    profiles: [claude]
    image: telegram-ai-org:claude
    container_name: aiorg-product-bot
    command: ["--org", "aiorg_product_bot"]
    depends_on:
      claude-runtime:
        condition: service_healthy
    environment:
      <<: *claude-bot-env
      PM_ORG_NAME: aiorg_product_bot

  # ===========================================================================
  # [claude 계열 봇] 디자인실 봇
  # ===========================================================================
  aiorg-design-bot:
    <<: *bot-common
    profiles: [claude]
    image: telegram-ai-org:claude
    container_name: aiorg-design-bot
    command: ["--org", "aiorg_design_bot"]
    depends_on:
      claude-runtime:
        condition: service_healthy
    environment:
      <<: *claude-bot-env
      PM_ORG_NAME: aiorg_design_bot

  # ===========================================================================
  # [claude 계열 봇] 개발실 봇
  # ===========================================================================
  aiorg-engineering-bot:
    <<: *bot-common
    profiles: [claude]
    image: telegram-ai-org:claude
    container_name: aiorg-engineering-bot
    command: ["--org", "aiorg_engineering_bot"]
    depends_on:
      claude-runtime:
        condition: service_healthy
    environment:
      <<: *claude-bot-env
      PM_ORG_NAME: aiorg_engineering_bot

  # ===========================================================================
  # [gemini 계열 봇] 운영실 봇
  # ===========================================================================
  aiorg-ops-bot:
    <<: *bot-common
    profiles: [gemini]
    image: telegram-ai-org:gemini
    container_name: aiorg-ops-bot
    command: ["--org", "aiorg_ops_bot"]
    depends_on:
      gemini-runtime:
        condition: service_healthy
    environment:
      <<: *gemini-bot-env
      PM_ORG_NAME: aiorg_ops_bot
      GEMINI_CLI_MODEL: ${GEMINI_CLI_MODEL:-gemini-2.5-pro}

  # ===========================================================================
  # [gemini 계열 봇] 성장실 봇
  # ===========================================================================
  aiorg-growth-bot:
    <<: *bot-common
    profiles: [gemini]
    image: telegram-ai-org:gemini
    container_name: aiorg-growth-bot
    command: ["--org", "aiorg_growth_bot"]
    depends_on:
      gemini-runtime:
        condition: service_healthy
    environment:
      <<: *gemini-bot-env
      PM_ORG_NAME: aiorg_growth_bot
      GEMINI_CLI_MODEL: ${GEMINI_CLI_MODEL:-gemini-2.5-pro}

  # ===========================================================================
  # [gemini 계열 봇] 리서치실 봇
  # ===========================================================================
  aiorg-research-bot:
    <<: *bot-common
    profiles: [gemini]
    image: telegram-ai-org:gemini
    container_name: aiorg-research-bot
    command: ["--org", "aiorg_research_bot"]
    depends_on:
      gemini-runtime:
        condition: service_healthy
    environment:
      <<: *gemini-bot-env
      PM_ORG_NAME: aiorg_research_bot
      GEMINI_CLI_MODEL: ${GEMINI_CLI_MODEL:-gemini-2.5-pro}

# =============================================================================
# 네트워크 — 모든 서비스가 공유하는 브리지 네트워크
# =============================================================================
networks:
  aiorg-network:
    driver: bridge
    name: aiorg-network
