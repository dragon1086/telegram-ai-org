<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIMesh 실시간 대시보드</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>" />
  <link rel="stylesheet" href="styles/comic-theme.css" />
  <link rel="stylesheet" href="styles/character-animation.css" />
  <style>
    /* 헤더 실시간 시계 */
    #live-clock {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      color: #ccc;
    }
    /* 연결 상태 배지 */
    #conn-status-badge { cursor: default; }
    #conn-status-badge.connected .dot   { background: var(--status-connected); }
    #conn-status-badge.disconnected .dot{ background: var(--status-disconnected); }
    #conn-status-badge.connecting .dot  { background: var(--status-connecting); animation: blink 1s ease infinite; }
    #conn-status-badge.reconnecting .dot{ background: var(--comic-orange); animation: blink 0.5s ease infinite; }
  </style>
</head>
<body>

<!-- ── 헤더 ── -->
<header class="dashboard-header">
  <div>
    <h1>⚡ AIMesh Dashboard</h1>
    <div class="subtitle">실시간 작업 시각화 &amp; 원격 접근 모니터링</div>
  </div>
  <div style="display:flex; align-items:center; gap:1rem;">
    <span id="live-clock">--:--:--</span>
    <div class="connection-badge" id="conn-status-badge">
      <span class="dot"></span>
      <span id="conn-status-text">연결중...</span>
    </div>
  </div>
</header>

<!-- ── 캐릭터 대시보드 (봇 상태 애니메이션) ── -->
<section id="character-dashboard" style="max-width:1360px;margin:1.5rem auto 0;padding:0 20px;"></section>

<style>
  /* ── 봇 스테이지 (풀 와이드) ── */
  #character-dashboard {
    background: #080c18;
    border-radius: 0 0 12px 12px;
    padding-bottom: 1.5rem;
  }
  #bot-stage {
    position: relative;
    background: #080c18;
  }
  #character-panels-grid {
    background: #080c18;
  }
  #character-panels-grid .character-panel {
    background: #0d1b2e;
    border: 2.5px solid #1a2e4a;
    border-radius: 12px;
    padding: 0.75rem;
  }
  #character-panels-grid .character-avatar {
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
    box-shadow: 0 0 0 2px #1a2e4a;
  }
  #character-panels-grid .character-img {
    display: block;
    border-radius: 6px;
  }
  @media (max-width: 900px) {
    #character-panels-grid { grid-template-columns: repeat(2,1fr) !important; }
  }
  @media (max-width: 540px) {
    #character-panels-grid { grid-template-columns: 1fr !important; }
  }

  /* ── 모드 뱃지 ── */
  .mode-badge {
    border-radius: 10px;
    padding: 2px 7px;
    font-size: 0.65rem;
    font-weight: 600;
    position: absolute;
    top: 6px;
    right: 6px;
    pointer-events: none;
  }
  .mode-badge.mode-working   { background: #0e2e3a; color: #22d3ee; }
  .mode-badge.mode-meeting   { background: #1a2e00; color: #a3e635; animation: modePulse 1.5s ease infinite; }
  .mode-badge.mode-retro     { background: #1e0e3a; color: #c084fc; }
  .mode-badge.mode-collab    { background: #0a2e1a; color: #22c55e; }
  .mode-badge.mode-delegated { background: #2e1400; color: #fb923c; }
  @keyframes modePulse { 0%,100%{opacity:1} 50%{opacity:0.6} }

  /* ── 협업 선 (SVG) ── */
  .collab-line {
    stroke: #22c55e;
    stroke-width: 2;
    stroke-dasharray: 6 3;
    opacity: 0.7;
  }
</style>

<style>
  /* ── Horizontal Task Graph ── */
  :root { --ts-node-h: 58px; --ts-node-mid: 29px; }
  .ts-graph-container { padding: 8px 0; }
  .ts-graph-section-title {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em;
    color: #4a6080; margin: 16px 0 8px; padding-left: 4px;
  }
  .ts-graph-row {
    display: flex; align-items: flex-start; margin-bottom: 14px; overflow-x: auto; padding-bottom: 2px;
  }
  .ts-gnode {
    min-height: var(--ts-node-h);
    background: #0c1a2e; border: 2px solid #1e3a5f; border-radius: 10px;
    padding: 7px 10px; cursor: pointer; flex-shrink: 0; position: relative;
    box-sizing: border-box; transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
  }
  .ts-gnode:hover { border-color: #3b82f6; background: #0f2040; box-shadow: 0 0 0 3px rgba(59,130,246,0.18); }
  .ts-gnode.ts-node-highlight {
    border-color: #fbbf24 !important; background: #130f00 !important;
    box-shadow: 0 0 0 4px rgba(251,191,36,0.3) !important;
    animation: tsNodePulse 0.5s ease;
  }
  @keyframes tsNodePulse { 0%{transform:scale(1.06)} 100%{transform:scale(1)} }
  .ts-gnode-parent { width: 185px; }
  .ts-gnode-child  { width: 175px; }
  .ts-gnode-label {
    font-size: 0.71rem; color: #c5d4e8; line-height: 1.38;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .ts-gnode-status-row { display: flex; align-items: center; gap: 4px; margin-top: 4px; }
  .ts-gnode-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .ts-gnode-status-text { font-size: 0.6rem; color: #6a8caa; }
  .ts-gnode-dept { font-size: 0.6rem; color: #3a5070; margin-top: 2px; }
  .ts-gnode.st-done, .ts-gnode.st-completed { border-color: #173825; }
  .ts-gnode.st-failed, .ts-gnode.st-error   { border-color: #3a1515; }
  .ts-gnode.st-in_progress, .ts-gnode.st-active { border-color: #1a3560; }
  .ts-gnode.st-cancelled { border-color: #1a2030; opacity: 0.65; }
  /* Connector */
  .ts-graph-h-line {
    width: 20px; height: 2px; background: #1e3a5f; flex-shrink: 0;
    align-self: flex-start; margin-top: var(--ts-node-mid); transform: translateY(-1px);
  }
  .ts-children-col {
    display: flex; flex-direction: column; gap: 6px;
    border-left: 2px solid #1e3a5f; padding-left: 14px;
  }
  .ts-gnode-child::before {
    content: ''; position: absolute; left: -16px;
    top: calc(var(--ts-node-mid) - 2px); width: 14px; height: 2px; background: #1e3a5f;
  }
  /* Current task link in character panels */
  .current-task-link {
    color: #60a5fa; text-decoration: none; font-size: 0.7rem;
    display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    padding: 2px 4px; border-radius: 4px; transition: background 0.15s;
    font-family: var(--font-comic-body, sans-serif);
  }
  .current-task-link:hover { background: rgba(96,165,250,0.15); text-decoration: underline; }
  /* Task detail popup */
  #ts-node-popup {
    position: fixed; background: #080f1e; border: 2px solid #2a4f80; border-radius: 10px;
    padding: 10px 13px; max-width: 280px; min-width: 160px; z-index: 9000;
    pointer-events: none; opacity: 0; transition: opacity 0.12s;
    font-size: 0.73rem; color: #c5d4e8; box-shadow: 0 8px 24px rgba(0,0,0,0.7);
  }
  #ts-node-popup.visible { opacity: 1; }
  .ts-popup-id   { font-size: 0.58rem; color: #4a6080; margin-bottom: 3px; word-break: break-all; }
  .ts-popup-desc { line-height: 1.45; color: #c5d4e8; margin-bottom: 5px; }
  .ts-popup-dept { color: #5a7090; font-size: 0.63rem; }
  /* Filter tabs */
  .ts-tree-tabs { display: flex; gap: 4px; }
  .ts-tab {
    padding: 4px 11px; border-radius: 6px; border: 1.5px solid #1e3a5f;
    background: transparent; color: #6a8caa; font-size: 0.7rem; cursor: pointer;
    font-family: var(--font-comic-body, sans-serif); transition: all 0.15s;
  }
  .ts-tab:hover { border-color: #3b82f6; color: #90b4d4; }
  .ts-tab.active { background: #1a3560; border-color: #3b82f6; color: #c5d4e8; }
  /* Show more / collapse */
  .ts-show-more { text-align: center; padding: 8px 0 2px; }
  .ts-show-more-btn {
    padding: 5px 18px; border-radius: 8px; border: 1.5px solid #1e3a5f;
    background: #0c1a2e; color: #6a8caa; font-size: 0.7rem; cursor: pointer;
    font-family: var(--font-comic-body, sans-serif); transition: all 0.15s;
  }
  .ts-show-more-btn:hover { border-color: #3b82f6; color: #c5d4e8; background: #0f2040; }
</style>


<!-- ── 퀵스타트 배너 (첫 방문 시만 표시, localStorage로 dismissed 저장) ── -->
<div id="quickstart-banner" style="
  display:none;
  position:fixed; top:0; left:0; right:0;
  background:var(--comic-yellow); border-bottom:3px solid var(--comic-dark);
  text-align:center; padding:0.55rem 3rem;
  font-family:var(--font-comic-body); font-weight:700; font-size:0.9rem;
  color:var(--comic-dark);
  z-index:9999;
  box-shadow:0 3px 0 var(--comic-dark);
">
  💡 대시보드 시작: <code style="background:rgba(0,0,0,0.1);padding:0.1rem 0.4rem;border-radius:4px;">python dashboard.py</code> 실행 후 이 페이지를 새로고침하세요
  <button id="quickstart-dismiss" aria-label="배너 닫기" style="
    position:absolute; right:1rem; top:50%; transform:translateY(-50%);
    background:none; border:2px solid var(--comic-dark); border-radius:50%;
    width:1.6rem; height:1.6rem; cursor:pointer;
    font-size:0.85rem; font-weight:700; line-height:1;
    display:flex; align-items:center; justify-content:center;
    color:var(--comic-dark);
    transition:background 0.15s;
  " onmouseover="this.style.background='rgba(0,0,0,0.1)'" onmouseout="this.style.background='none'">✕</button>
</div>
<script>
  (function () {
    if (!localStorage.getItem('aimesh_quickstart_dismissed')) {
      var banner = document.getElementById('quickstart-banner');
      if (banner) banner.style.display = 'block';
    }
    var btn = document.getElementById('quickstart-dismiss');
    if (btn) {
      btn.addEventListener('click', function () {
        localStorage.setItem('aimesh_quickstart_dismissed', '1');
        var banner = document.getElementById('quickstart-banner');
        if (banner) {
          banner.style.transition = 'opacity 0.3s ease';
          banner.style.opacity = '0';
          setTimeout(function () { banner.style.display = 'none'; }, 300);
        }
      });
    }
  })();
</script>


<!-- ══════════════════════════════════════════════════════════
     태스크 & 목표 섹션 (구 대시보드에서 병합)
     ══════════════════════════════════════════════════════════ -->
<style>
  /* ── Task/Goal Section Variables ─────────────────────── */
  .task-section-wrap {
    max-width: 1360px;
    margin: 0 auto;
    padding: 32px 20px 60px;
    font-family: 'IBM Plex Sans KR', system-ui, sans-serif;
    font-size: 14px;
    color: #dce8f8;
  }
  .task-section-divider {
    border: none;
    border-top: 2px solid #1a2540;
    margin: 0 0 32px;
  }
  .ts-section-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #4a5e7a;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ts-section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #1a2540;
  }
  .ts-summary-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 32px;
  }
  .ts-sum-card {
    background: #0c1220;
    border: 1px solid #1a2540;
    border-radius: 10px;
    padding: 18px 20px;
    position: relative;
    overflow: hidden;
  }
  .ts-sum-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px; height: 100%;
    border-radius: 10px 0 0 10px;
  }
  .ts-sum-card.active::before  { background: #22d3ee; }
  .ts-sum-card.done::before    { background: #22c55e; }
  .ts-sum-card.failed::before  { background: #f87171; }
  .ts-sum-card .s-label { font-size: 0.75rem; color: #4a5e7a; margin-bottom: 6px; font-family: 'IBM Plex Mono', monospace; }
  .ts-sum-card .s-value { font-family: 'IBM Plex Mono', monospace; font-size: 2.2rem; font-weight: 600; line-height: 1; }
  .ts-sum-card.active .s-value { color: #22d3ee; }
  .ts-sum-card.done   .s-value { color: #22c55e; }
  .ts-sum-card.failed .s-value { color: #f87171; }

  .ts-goals-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .ts-goal-card {
    background: #0c1220;
    border: 1px solid #1a2540;
    border-radius: 10px;
    padding: 14px 16px;
  }
  .ts-goal-card .goal-title {
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: #dce8f8;
  }
  .ts-goal-card .goal-meta {
    font-size: 0.72rem;
    color: #4a5e7a;
    margin-bottom: 8px;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .ts-goal-footer {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
  }
  .ts-goal-ts { font-size: 0.68rem; color: #4a5e7a; font-family: 'IBM Plex Mono', monospace; margin-left: auto; }
  .ts-progress-bar-wrap { background: #1a2540; border-radius: 3px; height: 5px; overflow: hidden; }
  .ts-progress-bar { height: 100%; background: #3b82f6; border-radius: 3px; transition: width 0.5s ease; }
  .ts-progress-bar.done-bar { background: #22c55e; }
  .ts-progress-label { font-size: 0.68rem; color: #4a5e7a; margin-top: 3px; text-align: right; font-family: 'IBM Plex Mono', monospace; }

  .ts-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 7px;
    border-radius: 4px;
    font-size: 0.68rem;
    font-weight: 600;
    font-family: 'IBM Plex Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .ts-badge-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .ts-badge.s-done, .ts-badge.s-completed     { background: #0a2e1a; color: #22c55e; }
  .ts-badge.s-done .ts-badge-dot,
  .ts-badge.s-completed .ts-badge-dot          { background: #22c55e; }
  .ts-badge.s-active, .ts-badge.s-in_progress  { background: #0e2e3a; color: #22d3ee; }
  .ts-badge.s-active .ts-badge-dot,
  .ts-badge.s-in_progress .ts-badge-dot        { background: #22d3ee; animation: ts-pulse-dot 1.4s ease-in-out infinite; }
  .ts-badge.s-failed, .ts-badge.s-error        { background: #2e0f0f; color: #f87171; }
  .ts-badge.s-failed .ts-badge-dot,
  .ts-badge.s-error .ts-badge-dot              { background: #f87171; }
  .ts-badge.s-cancelled                        { background: #1a1a1a; color: #4a5e7a; }
  .ts-badge.s-cancelled .ts-badge-dot          { background: #4a5e7a; }
  .ts-badge.s-needs_review                     { background: #2e1e0a; color: #fb923c; }
  .ts-badge.s-needs_review .ts-badge-dot       { background: #fb923c; }
  .ts-badge.s-pending                          { background: #1e1a2e; color: #a78bfa; }
  .ts-badge.s-pending .ts-badge-dot            { background: #a78bfa; }
  .ts-badge.s-max_iterations_reached           { background: #2e1e0a; color: #fb923c; }
  .ts-badge.s-max_iterations_reached .ts-badge-dot { background: #fb923c; }
  .ts-badge.s-default                          { background: #101828; color: #4a5e7a; }
  .ts-badge.s-default .ts-badge-dot            { background: #4a5e7a; }
  @keyframes ts-pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.5; transform: scale(0.7); }
  }

  .ts-subsection-label {
    font-size: 0.8rem;
    font-weight: 600;
    color: #94a3b8;
    margin-bottom: 10px;
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .ts-recurring-toggle {
    cursor: pointer;
    user-select: none;
    padding: 8px 12px;
    background: #0c1220;
    border: 1px solid #1a2540;
    border-radius: 8px;
    margin-bottom: 10px;
    transition: background 0.15s;
  }
  .ts-recurring-toggle:hover { background: #131c34; }
  .ts-recur-chevron { width: 14px; height: 14px; transition: transform 0.2s; flex-shrink: 0; }
  .ts-recurring-toggle.is-open .ts-recur-chevron { transform: rotate(90deg); }
  #ts-recurring-counts { margin-left: 6px; font-size: 0.7rem; color: #64748b; font-weight: 400; }
  .ts-recurring-section {
    background: #080c18;
    border: 1px solid #1a2540;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 28px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }
  .ts-recurring-group-title {
    font-size: 0.75rem;
    font-weight: 600;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
  }
  .ts-goals-grid.small-grid {
    grid-template-columns: 1fr;
    gap: 8px;
    margin-bottom: 0;
  }
  .ts-goals-grid.small-grid .ts-goal-card { padding: 10px 12px; }
  .ts-goals-grid.small-grid .ts-goal-card .goal-title { font-size: 0.78rem; }

  .ts-task-tree { margin-bottom: 32px; display: flex; flex-direction: column; gap: 8px; }
  .ts-tree-root {
    background: #0c1220;
    border: 1px solid #1a2540;
    border-radius: 10px;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .ts-tree-root:hover { border-color: #243050; }
  .ts-tree-root.is-open { border-color: #1e3a5f; }
  .ts-tree-root-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }
  .ts-tree-root-header:hover { background: #101828; }
  .ts-tree-chevron { width: 16px; height: 16px; flex-shrink: 0; color: #4a5e7a; transition: transform 0.2s ease; }
  .ts-tree-root.is-open .ts-tree-chevron { transform: rotate(90deg); }
  .ts-tree-root-label { flex: 1; font-size: 0.84rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .ts-tree-root-dept { font-size: 0.7rem; color: #93c5fd; font-family: 'IBM Plex Mono', monospace; flex-shrink: 0; }
  .ts-tree-root-ts { font-size: 0.68rem; color: #4a5e7a; font-family: 'IBM Plex Mono', monospace; flex-shrink: 0; }
  .ts-tree-child-count {
    font-size: 0.65rem; color: #4a5e7a; background: #101828;
    border: 1px solid #1a2540; border-radius: 10px; padding: 1px 7px;
    font-family: 'IBM Plex Mono', monospace; flex-shrink: 0;
  }
  .ts-tree-children { display: none; border-top: 1px solid #1a2540; }
  .ts-tree-root.is-open .ts-tree-children { display: block; }
  .ts-tree-section-divider {
    font-size: 0.72rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.08em; color: #475569; padding: 12px 0 8px;
    border-top: 1px solid #1a2540; margin-top: 8px;
  }
  .ts-subtask-table { width: 100%; border-collapse: collapse; }
  .ts-subtask-table thead tr { background: #080c14; }
  .ts-subtask-table th {
    padding: 7px 16px; font-size: 0.68rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em; color: #4a5e7a;
    text-align: left; font-family: 'IBM Plex Mono', monospace;
    border-bottom: 1px solid #1a2540;
  }
  .ts-subtask-table tbody tr { border-top: 1px solid #1a2540; }
  .ts-subtask-table tbody tr:hover { background: #0e1628; }

<script>
(function () {
  'use strict';

  // ── Helpers ──────────────────────────────────────────────────────────
  function tsEsc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function tsFmtTs(ts) {
    if (!ts) return '—';
    try {
      const d = new Date(ts.replace(' ','T') + (ts.includes('T') ? '' : 'Z'));
      return d.toLocaleString('ko-KR', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
    } catch { return ts.slice(0,16); }
  }
  function tsShortDept(dept) {
    if (!dept) return '—';
    const map = {
      aiorg_engineering_bot:'개발실', aiorg_design_bot:'디자인실',
      aiorg_planning_bot:'기획실',    aiorg_growth_bot:'성장실',
      aiorg_research_bot:'리서치실',  aiorg_ops_bot:'운영실',
      aiorg_pm_bot:'PM',
    };
    return map[dept] || dept.replace('aiorg_','').replace('_bot','');
  }
  function tsBadgeKey(status) {
    const known = ['done','completed','active','in_progress','failed','error',
                   'cancelled','needs_review','pending','max_iterations_reached'];
    return known.includes(status) ? status : 'default';
  }
  function tsStatusIcon(status) {
    const icons = { done:'✅', completed:'✅', active:'🔄', in_progress:'🔄',
                    failed:'❌', error:'❌', cancelled:'⚫', needs_review:'🟠',
                    pending:'🔵', max_iterations_reached:'🟠' };
    return icons[status] || '⚪';
  }
  function tsBadge(status) {
    const k = tsBadgeKey(status);
    return `<span class="ts-badge s-${k}"><span class="ts-badge-dot"></span>${tsStatusIcon(status)} ${tsEsc(status||'?')}</span>`;
  }

  // ── Summary ──────────────────────────────────────────────────────────
  async function tsLoadSummary() {
    try {
      const r = await fetch('/api/v1/dashboard/summary');
      if (!r.ok) return;
      const d = await r.json();
      const g = d.goals || {};
      const t = d.tasks || {};
      document.getElementById('ts-cnt-active-goals').textContent = g.active || 0;
      document.getElementById('ts-cnt-done-tasks').textContent   = t.done || t.completed || 0;
      document.getElementById('ts-cnt-failed-tasks').textContent = t.failed || t.error || 0;
    } catch (e) { console.warn('[ts] summary error', e); }
  }

  // ── Goals ────────────────────────────────────────────────────────────
  function tsRenderGoalCards(goals, containerId, compact) {
    const el = document.getElementById(containerId);
    if (!el) return;
    if (!goals || !goals.length) {
      el.innerHTML = `<div class="ts-empty" style="grid-column:1/-1;padding:16px 0;color:#334155">없음</div>`;
      return;
    }
    el.innerHTML = goals.map(g => {
      const iter    = g.iteration || 0;
      const maxIter = g.max_iterations || 1;
      const pct     = Math.min(100, Math.round((iter / maxIter) * 100));
      const isDone  = ['completed','done','achieved'].includes(g.status);
      const prog    = g.last_progress
        ? g.last_progress.slice(0, compact ? 60 : 90) + (g.last_progress.length > (compact ? 60 : 90) ? '…' : '')
        : '';
      return `<div class="ts-goal-card">
        <div class="goal-title" title="${tsEsc(g.title||'')}">${tsEsc(g.title||'(제목 없음)')}</div>
        ${prog && !compact ? `<div class="goal-meta">${tsEsc(prog)}</div>` : ''}
        <div class="ts-progress-bar-wrap" style="margin-bottom:3px">
          <div class="ts-progress-bar${isDone?' done-bar':''}" style="width:${pct}%"></div>
        </div>
        <div class="ts-progress-label">${iter} / ${maxIter} iter · ${pct}%</div>
        <div class="ts-goal-footer">
          ${tsBadge(g.status)}
          <span class="ts-goal-ts">${tsFmtTs(g.updated_at)}</span>
        </div>
      </div>`;
    }).join('');
  }

  async function tsLoadGoals() {
    try {
      const r = await fetch('/api/v1/dashboard/goals-hierarchy?limit=60');
      if (!r.ok) return;
      const data = await r.json();
      tsRenderGoalCards(data.long_term || [], 'ts-goals-long-term', false);
      const rec = data.recurring || {};
      tsRenderGoalCards(rec.retro  || [], 'ts-goals-retro',  true);
      tsRenderGoalCards(rec.weekly || [], 'ts-goals-weekly', true);
      tsRenderGoalCards(rec.audit  || [], 'ts-goals-audit',  true);
      tsRenderGoalCards(rec.other  || [], 'ts-goals-other',  true);
      ['retro','weekly','audit','other'].forEach(k => {
        const grp = document.getElementById(`ts-rg-${k}`);
        if (grp) grp.style.display = (rec[k] && rec[k].length) ? '' : 'none';
      });
      const total = (rec.retro||[]).length + (rec.weekly||[]).length +
                    (rec.audit||[]).length + (rec.other||[]).length;
      const countEl = document.getElementById('ts-recurring-counts');
      if (countEl) countEl.textContent = total ? `(${total}건)` : '';
    } catch (e) { console.warn('[ts] goals error', e); }
  }

  window.tsToggleRecurring = function () {
    const sec = document.getElementById('ts-recurring-section');
    const tog = document.getElementById('ts-recurring-toggle');
    if (!sec) return;
    const open = sec.style.display !== 'none';
    sec.style.display = open ? 'none' : 'grid';
    tog.classList.toggle('is-open', !open);
  };

  // ── Task Graph (Horizontal) ──────────────────────────────────────────
  window._tsNodeData = {};

  function tsNodeDotColor(status) {
    const m = { done:'#00C851', completed:'#00C851', active:'#3b82f6', in_progress:'#3b82f6',
                failed:'#FF3B3F', error:'#FF3B3F', cancelled:'#6b7280', pending:'#a78bfa',
                blocked:'#FF6B00', max_iterations_reached:'#FF6B00' };
    return m[status] || '#6b7280';
  }

  function tsStatusCls(status) {
    const k = (status || '').replace(/[^a-z_]/g, '');
    return ['done','completed','active','in_progress','failed','error','cancelled','pending','blocked'].includes(k)
      ? 'st-' + k : '';
  }

  function tsRenderNode(node, isParent) {
    const cls = isParent ? 'ts-gnode-parent' : 'ts-gnode-child';
    const sc  = tsStatusCls(node.status);
    const lbl = tsEsc(node.label || node.id || '—');
    const sid = tsEsc(node.id);
    window._tsNodeData[node.id] = { id: node.id, label: node.label || node.id, dept: node.dept, status: node.status };
    return `<div class="ts-gnode ${cls} ${sc}" id="task-${sid}"
      onmouseenter="tsShowPopup(event,'${sid}')"
      onmouseleave="tsHidePopup()"
      onclick="tsClickNode('${sid}')">
      <div class="ts-gnode-label" title="${lbl}">${lbl}</div>
      <div class="ts-gnode-status-row">
        <span class="ts-gnode-dot" style="background:${tsNodeDotColor(node.status)}"></span>
        <span class="ts-gnode-status-text">${tsEsc(node.status || '?')}</span>
      </div>
      <div class="ts-gnode-dept">${tsEsc(tsShortDept(node.dept))}</div>
    </div>`;
  }

  function tsRenderGraphRow(root, childrenOf) {
    const children = childrenOf[root.id] || [];
    const parentHtml = tsRenderNode(root, true);
    if (!children.length) {
      return `<div class="ts-graph-row">${parentHtml}</div>`;
    }
    const childrenHtml = children.map(c => tsRenderNode(c, false)).join('');
    return `<div class="ts-graph-row">
      ${parentHtml}
      <div class="ts-graph-h-line"></div>
      <div class="ts-children-col">${childrenHtml}</div>
    </div>`;
  }

  // ── Tree filter/pagination state ─────────────────────────────────────
  const _TREE_PAGE = 12;
  window._tsTreeCache    = null;   // { projectRoots, retroRoots, childrenOf }
  window._tsTreeFilter   = 'all';
  window._tsTreeExpanded = false;

  function _tsActiveStatuses(filter) {
    if (filter === 'running') return new Set(['running','active','in_progress']);
    if (filter === 'failed')  return new Set(['failed','error']);
    return null; // all
  }

  function _tsFilterRoots(roots, childrenOf, filter) {
    const s = _tsActiveStatuses(filter);
    if (!s) return roots;
    return roots.filter(r => s.has(r.status) || (childrenOf[r.id] || []).some(c => s.has(c.status)));
  }

  function tsRenderTreeFromCache() {
    const container = document.getElementById('ts-task-tree');
    if (!window._tsTreeCache) return;
    const { projectRoots, retroRoots, childrenOf } = window._tsTreeCache;
    const filter   = window._tsTreeFilter;
    const filtered = _tsFilterRoots(projectRoots, childrenOf, filter);
    const limit    = window._tsTreeExpanded ? Infinity : _TREE_PAGE;
    const visible  = filtered.slice(0, limit);
    const hidden   = filtered.length - visible.length;

    if (!visible.length && !retroRoots.length) {
      const label = filter === 'running' ? '현재 진행중인 태스크 없음' : filter === 'failed' ? '실패 태스크 없음' : '태스크 없음';
      container.innerHTML = `<div class="ts-empty" style="background:#0c1220;border:1px solid #1a2540;border-radius:10px;padding:24px;text-align:center">${label}</div>`;
      return;
    }

    let html = '<div class="ts-graph-container">';
    html += visible.map(r => tsRenderGraphRow(r, childrenOf)).join('');
    if (hidden > 0) {
      html += `<div class="ts-show-more"><button class="ts-show-more-btn" onclick="tsExpandTree()">▼ ${hidden}개 더 보기</button></div>`;
    } else if (window._tsTreeExpanded && filtered.length > _TREE_PAGE) {
      html += `<div class="ts-show-more"><button class="ts-show-more-btn" onclick="tsCollapseTree()">▲ 접기</button></div>`;
    }
    if (retroRoots.length && filter === 'all') {
      html += '<div class="ts-graph-section-title">🔄 수명 업무</div>';
      html += retroRoots.map(r => tsRenderGraphRow(r, childrenOf)).join('');
    }
    html += '</div>';
    container.innerHTML = html;
  }

  window.tsSetTreeFilter = function (filter) {
    window._tsTreeFilter   = filter;
    window._tsTreeExpanded = false;
    document.querySelectorAll('.ts-tab').forEach(t => t.classList.toggle('active', t.dataset.filter === filter));
    tsRenderTreeFromCache();
  };
  window.tsExpandTree   = function () { window._tsTreeExpanded = true;  tsRenderTreeFromCache(); };
  window.tsCollapseTree = function () { window._tsTreeExpanded = false; tsRenderTreeFromCache(); };

  async function tsLoadTaskTree() {
    const container = document.getElementById('ts-task-tree');
    try {
      const r = await fetch('/api/v1/dashboard/task-graph?days=30&limit=200');
      if (!r.ok) throw new Error('API error');
      const data = await r.json();
      if (!data.nodes || !data.nodes.length) {
        container.innerHTML = '<div class="ts-empty" style="background:#0c1220;border:1px solid #1a2540;border-radius:10px;padding:32px">최근 30일 내 태스크 없음</div>';
        return;
      }
      const nodeMap    = new Map(data.nodes.map(n => [n.id, n]));
      const childrenOf = {};
      (data.edges || []).forEach(e => {
        if (!childrenOf[e.source]) childrenOf[e.source] = [];
        const child = nodeMap.get(e.target);
        if (child) childrenOf[e.source].push(child);
      });
      window._tsTreeCache = {
        projectRoots: data.nodes.filter(n => n.depth === 0 && !n.virtual && n.task_type !== 'retro' && n.task_type !== 'weekly'),
        retroRoots:   data.nodes.filter(n => n.depth === 0 && (n.virtual || n.task_type === 'retro' || n.task_type === 'weekly')),
        childrenOf,
      };
      tsRenderTreeFromCache();
    } catch (e) {
      container.innerHTML = '<div class="ts-empty" style="background:#0c1220;border:1px solid #1a2540;border-radius:10px;padding:32px">태스크 트리 로드 실패</div>';
      console.warn('[ts] task tree error', e);
    }
  }

  // ── Global graph interaction ──────────────────────────────────────────
  window.tsHighlightNode = function (taskId) {
    const el = document.getElementById('task-' + taskId);
    if (!el) {
      document.getElementById('ts-task-tree')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.add('ts-node-highlight');
    setTimeout(() => el.classList.remove('ts-node-highlight'), 2000);
  };
  window.tsShowPopup = function (evt, nodeId) {
    const p = document.getElementById('ts-node-popup');
    if (!p) return;
    const d = window._tsNodeData[nodeId];
    if (!d) return;
    p.innerHTML = `<div class="ts-popup-id">${tsEsc(d.id)}</div>
      <div class="ts-popup-desc">${tsEsc(d.label)}</div>
      <div class="ts-popup-dept">${tsEsc(tsShortDept(d.dept))}</div>
      <div style="margin-top:4px;display:flex;align-items:center;gap:4px">
        <span style="width:7px;height:7px;border-radius:50%;background:${tsNodeDotColor(d.status)};display:inline-block;flex-shrink:0"></span>
        <span style="font-size:0.62rem;color:#6a8caa">${tsEsc(d.status || '?')}</span>
      </div>`;
    const rect = evt.currentTarget.getBoundingClientRect();
    p.style.left = (rect.right + 10) + 'px';
    p.style.top  = rect.top + 'px';
    p.classList.add('visible');
    requestAnimationFrame(() => {
      const pr = p.getBoundingClientRect();
      if (pr.right  > window.innerWidth  - 8) p.style.left = (rect.left - pr.width - 10) + 'px';
      if (pr.bottom > window.innerHeight - 8) p.style.top  = (window.innerHeight - pr.height - 8) + 'px';
    });
  };
  window.tsHidePopup = () => document.getElementById('ts-node-popup')?.classList.remove('visible');
  window.tsClickNode = function (nodeId) {
    const el = document.getElementById('task-' + nodeId);
    if (el) {
      el.classList.add('ts-node-highlight');
      setTimeout(() => el.classList.remove('ts-node-highlight'), 1500);
    }
  };

  // ── Tasks Feed ───────────────────────────────────────────────────────
  async function tsLoadTasks() {
    try {
      const r = await fetch('/api/v1/dashboard/tasks?limit=30');
      if (!r.ok) return;
      const tasks  = await r.json();
      const tbody  = document.getElementById('ts-tasks-tbody');
      if (!tasks.length) {
        tbody.innerHTML = '<tr><td colspan="4" class="ts-empty">태스크 없음</td></tr>';
        return;
      }
      tbody.innerHTML = tasks.map(t => `<tr>
        <td>${tsBadge(t.status)}</td>
        <td class="dept">${tsEsc(tsShortDept(t.assigned_dept))}</td>
        <td class="desc" title="${tsEsc(t.description||'')}">${tsEsc(t.description||'—')}</td>
        <td class="ts">${tsFmtTs(t.updated_at)}</td>
      </tr>`).join('');
    } catch (e) { console.warn('[ts] tasks error', e); }
  }

  // ── Refresh loop ─────────────────────────────────────────────────────
  async function tsRefresh() {
    await Promise.all([tsLoadSummary(), tsLoadGoals(), tsLoadTasks(), tsLoadTaskTree()]);
  }

  tsRefresh();
  setInterval(tsLoadSummary,  30000);
  setInterval(tsLoadGoals,    30000);
  setInterval(tsLoadTaskTree, 30000);
  setInterval(tsLoadTasks,     5000);
})();
</script>

<script type="module">
  import { DashboardClient }     from './services/client.js';
  import { Dashboard }           from './components/Dashboard.js';
  import { createApiClient }     from './api/client.js';
  import { RealtimeStatusHook }  from './hooks/useRealtimeStatus.js';

  // ── 캐릭터 대시보드 (봇 애니메이션 패널) ────────────────────

      mode:         'polling',
      pollInterval: 3000,
      apiClient,
    });
    const charDashboard = new Dashboard(charDashboardEl);
    charDashboard.init(apiClient, realtimeHook);
  }

  // ── DashboardClient 초기화 및 시작 ───────────────────────
  const dashClient = new DashboardClient();
  dashClient
    .mount({
      badgeEl:   document.getElementById('conn-status-badge'),
      badgeText: document.getElementById('conn-status-text'),
    })
    .setPanels({ ticketPanel, tasksPanel, remotePanel })
    .start();

  // ── 실시간 시계 ───────────────────────────────────────────
  function updateClock() {
    document.getElementById('live-clock').textContent =
      new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  updateClock();
  setInterval(updateClock, 1000);
</script>
