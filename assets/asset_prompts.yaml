# assets/asset_prompts.yaml
# AIMesh 이미지 자산 생성 설정
# 재생성: python tools/generate_assets.py
# 갱신일: 2026-04-02 (AIMesh 브랜딩 전환)

images:
  # ── AIMesh 로고 ────────────────────────────────────────────────────────────

  - id: aimesh_logo
    output_path: assets/logo.png
    model: gemini-3.1-flash-image-preview
    thinking_mode: true
    width: 1024
    height: 1024
    prompt: >
      Minimalist logo for 'AIMesh' — an AI organization platform where multiple AI agents
      collaborate as one team. Abstract mesh network of 6-7 connected nodes forming a
      brain-like organic pattern. Each node is slightly different size representing hierarchy
      (1 large orchestrator node + 6 smaller specialist nodes). Smooth gradients from
      deep indigo (#4F46E5) to emerald (#059669). Clean white background. Modern tech
      aesthetic, flat design with subtle depth. No text, no animals, no characters.
      Professional SaaS logo quality suitable for GitHub README header.
      Style: modern minimalist tech logo, clean vector look, neural mesh network.

  # ── "이게 뭔가요?" 섹션 — 동작 흐름 개요 ─────────────────────────────────────

  - id: aimesh_overview
    output_path: assets/diagrams/aimesh_overview.png
    model: gemini-3.1-flash-image-preview
    thinking_mode: true
    width: 1200
    height: 600
    prompt: >
      Clean infographic showing the AIMesh workflow in 4 steps, left to right flow:
      Step 1: A user icon sends a message to a Telegram chat bubble (labeled "Telegram").
      Step 2: A central brain/hub node (labeled "PM Bot") receives and analyzes the message.
      Step 3: The PM Bot routes to 6 department icons arranged in a fan pattern:
        Engineering (code icon), Design (palette icon), Planning (clipboard icon),
        Growth (chart icon), Research (magnifier icon), Ops (gear icon).
      Step 4: Results flow back to the user in the Telegram chat.
      Numbered steps 1→2→3→4 with arrows connecting each stage.
      Color scheme: indigo (#4F46E5) primary, emerald (#059669) accent, white background.
      Style: clean flat illustration, modern tech infographic, no text clutter,
      professional documentation quality. Wide format 2:1 ratio.

  # ── 주요 기능 섹션 — 4개 피처 이미지 ──────────────────────────────────────────

  - id: feat_routing
    output_path: assets/diagrams/feat_routing.png
    model: gemini-3.1-flash-image-preview
    thinking_mode: true
    width: 600
    height: 400
    prompt: >
      Simple diagram showing smart routing: a central brain node icon receiving a chat
      message on the left, analyzing it, then routing to 3 different colored department
      icons on the right with directional arrows. Flat minimal style, indigo (#4F46E5)
      primary color, white background. Small compact illustration, icon-style.
      No text labels. Clean vector look.

  - id: feat_collab
    output_path: assets/diagrams/feat_collab.png
    model: gemini-3.1-flash-image-preview
    thinking_mode: true
    width: 600
    height: 400
    prompt: >
      Simple diagram showing multi-bot collaboration: 6 colored circles arranged in a
      hexagonal pattern, connected by thin lines forming a mesh network. Each circle has
      a small unique icon inside (code brackets, paint brush, clipboard, chart, magnifier,
      gear). Lines pulse with data flowing between nodes. Flat design, indigo and emerald
      palette, white background. Small compact illustration. No text. Clean vector look.

  - id: feat_engines
    output_path: assets/diagrams/feat_engines.png
    model: gemini-3.1-flash-image-preview
    thinking_mode: true
    width: 600
    height: 400
    prompt: >
      Simple diagram showing 3 AI engine icons side by side connected to a central platform
      hub: Claude (purple hexagon), Codex (green hexagon), Gemini (blue hexagon).
      Each engine connects to the central AIMesh hub with bidirectional arrows.
      Flat tech comparison layout, clean white background, modern minimal style.
      Small compact illustration. No text labels. Vector-style icons.

  - id: feat_skills
    output_path: assets/diagrams/feat_skills.png
    model: gemini-3.1-flash-image-preview
    thinking_mode: true
    width: 600
    height: 400
    prompt: >
      Simple diagram showing a modular plugin system: a robot/bot icon on the left
      with 4 puzzle pieces connecting to it from the right. Each puzzle piece is a
      different color (indigo, emerald, amber, rose) representing different skills/plugins.
      Clean flat illustration, white background, minimal tech style.
      Small compact illustration. No text. Vector-style.

  # ── 아키텍처 다이어그램 (Mermaid 교체용) ──────────────────────────────────────

  - id: architecture_overview
    output_path: assets/diagrams/architecture_overview.png
    model: gemini-3.1-flash-image-preview
    thinking_mode: true
    width: 1400
    height: 900
    prompt: >
      Professional system architecture diagram for AIMesh multi-bot AI platform.
      White background, clean corporate tech style.
      Layout (top to bottom, 3 tiers):
      TOP: User icon with Telegram logo, arrow down to PM Bot.
      MIDDLE: Large rounded box "PM Bot" (indigo #4F46E5, white text) in center.
        Six arrows fan out from PM Bot to 6 department boxes arranged in an arc:
        Engineering (orange), Design (pink), Planning (purple),
        Growth (teal), Research (yellow), Ops (green).
        Each box shows a small icon + department name in Korean+English.
      BOTTOM: Three engine boxes connected from departments:
        "Claude Code" (purple box), "Codex" (green box), "Gemini CLI" (blue box).
        Dotted lines show which departments connect to which engine:
        Engineering→Codex(primary)/Claude(fallback), Design→Gemini/Claude,
        Planning→Codex/Gemini, PM→Claude/Gemini,
        Growth/Research/Ops→Gemini/Claude.
      A shared DB/Memory cylinder at the very bottom connected to all engines.
      Style: clean labeled boxes, thin arrows, subtle shadows, professional documentation.
      No decorative elements. Clear readable hierarchy.
