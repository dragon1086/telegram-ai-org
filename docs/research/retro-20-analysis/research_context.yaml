# 8. 변수 교차 맥락 (RETRO-20 핵심 필드 — 이 파일이 직접 구현 예시)
variables_context:

  # 이 조사 시점의 활성 변수 스냅샷
  active_variables:
    model_version: "gemini-2.5-flash"
    infra_baseline_version: "v1.2.0"
    research_date: "2026-03-29T10:00:00+09:00"
    external_dependencies: []

  # 이전 조사(RETRO-14, 2026-03-27) 대비 변수 교차 구간 명시
  cross_variable_periods:
    - period: "RETRO-14(2026-03-27) → RETRO-20(2026-03-29)"
      variables_changed:
        - name: "research_date"
          from: "2026-03-27T10:00:00+09:00"
          to: "2026-03-29T10:00:00+09:00"
          changed_at: "2026-03-29"
        # model_version: 변경 없음 — gemini-2.5-flash 유지
        # infra_baseline_version: 변경 없음 — v1.2.0 유지
      variables_unchanged:
        - model_version: "gemini-2.5-flash"    # RETRO-14와 동일 — 교차 없음
        - infra_baseline_version: "v1.2.0"     # RETRO-14와 동일 — 교차 없음
      impact_note: |
        RETRO-14 → RETRO-20 구간에서 변경된 변수는 research_date(조사 시점)만 2일 경과.
        model_version(gemini-2.5-flash)과 infra_baseline_version(v1.2.0)은 동일하게 유지.
        따라서 두 조사 간 결과 차이는 오직 조사 시점(2일) 차이에만 귀속 가능.
        이 구간에서 model_version 또는 infra 버전이 변경되었다면 "원인 이분 불가" 상태가
        되었을 것이므로, 향후 모델 업그레이드 시 반드시 단독 조사 시점으로 분리할 것.

  # 원인 이분 신뢰도 판정
  isolation_confidence: "high"
  isolation_reason: |
    model_version(gemini-2.5-flash)과 infra_baseline_version(v1.2.0) 모두 불변.
    단일 변수(research_date, 2일 경과)만 변경되어 결과 차이 발생 시 원인 이분 가능.
    gemini-2.5-flash + v1.2.0 조합이 안정적으로 유지되는 한 결과 신뢰도 HIGH 유지.
