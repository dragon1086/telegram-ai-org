# =============================================================================
# v1.0.0-snapshot.yaml — criteria_version 1.0.0 근거 레퍼런스 스냅샷
#
# 목적 (RETRO-37):
#   criteria_version 1.0.0 이 확정된 시점의 근거 레퍼런스를 스냅샷으로 고정.
#   버전 회귀 분석 시 "이 기준은 어떤 레퍼런스에서 왔는가"를 즉시 추적 가능하게 함.
#
# 운영 규칙:
#   - 이 파일은 불변(immutable). 한 번 커밋되면 수정하지 않는다.
#   - criteria_version이 변경될 때마다 새 스냅샷 파일을 생성한다.
#     예: v1.1.0 → v1.1.0-snapshot.yaml (이 파일 복사 후 변경 사항만 업데이트)
#   - 스냅샷 파일명: v{criteria_version}-snapshot.yaml
#   - 저장 경로: docs/research/criteria-snapshots/
#
# 생성: 2026-03-31 (RETRO-37 리서치실)
# 작성: aiorg_research_bot
# 연결 파일: criteria_tracking.yaml (metadata.research_snapshot_ref)
# =============================================================================

snapshot_metadata:
  criteria_version: "1.0.0"
  snapshot_date: "2026-03-31T00:00:00+09:00"
  snapshot_author: "aiorg_research_bot"
  retro_task: "RETRO-37"
  prd_ref: "RETRO-exit-code-143-prevention-prd v1.0"
  purpose: "기준 v1.0.0 확정 시점의 근거 레퍼런스 목록 고정 — 회귀 분석용"
  immutable: true  # 이 파일은 수정 금지

# --- 리서치 컨텍스트 (조사 시점 환경) ---
research_context:
  research_date: "2026-03-31T00:00:00+09:00"
  researcher_agent: "리서치실/aiorg_research_bot"
  model_version: "claude-sonnet-4-5"
  infra_baseline_version: "v1.2.0"
  variables_context:
    active_variables:
      model_version: "claude-sonnet-4-5"
      infra_baseline_version: "v1.2.0"
      research_date: "2026-03-31T00:00:00+09:00"
      external_dependencies: []
    cross_variable_periods: []  # 초기 스냅샷 — 이전 버전 없음
    isolation_confidence: "n/a"  # 최초 스냅샷 (이전 버전 비교 없음)

# --- threshold별 근거 레퍼런스 스냅샷 ---
threshold_snapshots:

  exit_code_143:
    description: "SIGTERM 기반 exit code 143 차단 기준"
    confirmed_values:
      block_threshold: 3
      warn_threshold: 1
      unit: "occurrences"
    decision_weight: "criteria"  # 이 threshold의 전체 분류
    confirmed_refs:
      - id: "retro-26-C-04"
        title: "amp_caller.py 하드코딩 타임아웃 120s 분석"
        weight: "criteria"
        source_doc: "docs/research/retro-26-analysis/report.md"
        rationale: "SDK hang watchdog 패턴 — block_threshold=3 근거. false positive 허용 범위(1~2회) + 명확한 반복(3회) 임계 설정."
        accessed_at: "2026-03-31"
      - id: "retro-26-C-01"
        title: "SDK hang watchdog CancelledError 전파 분석"
        weight: "criteria"
        source_doc: "docs/research/retro-26-analysis/report.md"
        rationale: "SIGTERM 전파 경로 확인 — exit code 143의 발생 원인 메커니즘 근거. 차단 로직 설계에 직접 반영."
        accessed_at: "2026-03-31"
      - id: "retro-26-C-07"
        title: "exit code 143 vs 124 구분 기준 (SIGTERM vs timeout)"
        weight: "reference"
        source_doc: "docs/research/retro-26-analysis/report.md"
        rationale: "탐지 정밀도 향상 참고. threshold 값 결정에는 미사용 — 143 vs 124 구분은 필터 레벨."
        accessed_at: "2026-03-31"
    rejected_refs: []  # 검토 후 기각된 레퍼런스 없음

  error_pattern_repeat:
    description: "반복 에러 패턴 자동 수정 차단 기준"
    confirmed_values:
      block_threshold: 3
      warn_threshold: 1
      unit: "occurrences"
      lookback_days: 14
    decision_weight: "reference"
    confirmed_refs:
      - id: "improvement_thresholds_v1"
        title: "기존 improvement_thresholds.yaml 기준값 (운영 실적 기반)"
        weight: "reference"
        source_doc: "improvement_thresholds.yaml"
        rationale: "실제 운영 데이터 기반 임계값. 외부 레퍼런스 없이 운영 실적으로 확정됨 — reference 분류."
        accessed_at: "2026-03-31"
    rejected_refs: []

  task_timeout_hard:
    description: "단일 태스크 절대 타임아웃 차단 기준"
    confirmed_values:
      block_threshold: 1800  # 초 (30분)
      warn_threshold: 1200   # 초 (20분)
      unit: "seconds"
    decision_weight: "criteria"
    confirmed_refs:
      - id: "infra-baseline-v1.1.0"
        title: "infra-baseline.yaml bot_max_task_sec 기준 (v1.1.0)"
        weight: "criteria"
        source_doc: "infra-baseline.yaml"
        rationale: "운영 환경 실측값 기반 — E2E 최장 실행 시나리오 커버하는 30분 절대 상한. 현재 운영 중인 값과 일치."
        accessed_at: "2026-03-31"
      - id: "retro-14-timeout-analysis"
        title: "timeout 변수 교차 분석 (RETRO-14)"
        weight: "reference"
        source_doc: "docs/research/retro-14-analysis/report.md"
        rationale: "timeout 설정이 인프라 baseline과 교차할 때 영향 범위 분석 — 참고용. 수치 결정에는 미사용."
        accessed_at: "2026-03-31"
    rejected_refs: []

# --- 전체 레퍼런스 목록 요약 (빠른 조회용) ---
all_refs_summary:
  total: 6
  by_weight:
    criteria: 3
    reference: 3
    rejected: 0
  refs_list:
    - { id: "retro-26-C-04", threshold: "exit_code_143", weight: "criteria" }
    - { id: "retro-26-C-01", threshold: "exit_code_143", weight: "criteria" }
    - { id: "retro-26-C-07", threshold: "exit_code_143", weight: "reference" }
    - { id: "improvement_thresholds_v1", threshold: "error_pattern_repeat", weight: "reference" }
    - { id: "infra-baseline-v1.1.0", threshold: "task_timeout_hard", weight: "criteria" }
    - { id: "retro-14-timeout-analysis", threshold: "task_timeout_hard", weight: "reference" }

# --- 다음 버전 가이드 ---
next_version_guide:
  trigger: "criteria_tracking.yaml의 criteria_version 변경 시 즉시 생성"
  steps:
    - "이 파일을 v{new_version}-snapshot.yaml로 복사"
    - "threshold_snapshots에서 변경된 항목만 업데이트"
    - "변경되지 않은 항목은 그대로 유지"
    - "snapshot_metadata.criteria_version + snapshot_date + snapshot_author 갱신"
    - "all_refs_summary 재집계"
    - "criteria_tracking.yaml의 metadata.research_snapshot_ref 경로 업데이트"
